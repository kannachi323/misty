<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Misty Beta Launch Tracker</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0b0b;
      --panel: #141414;
      --panel-2: #191919;
      --line: #2b2b2b;
      --line-strong: #3a3a3a;
      --text: #eeeeee;
      --muted: #9a9a9a;
      --soft: #6f6f6f;
      --accent: #8fb7ff;
      --good: #83d99a;
      --warn: #e2c16f;
      --danger: #e08383;
      --shadow: rgba(0, 0, 0, 0.38);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      display: grid;
      min-height: 100vh;
      grid-template-rows: auto minmax(0, 1fr);
    }

    .topbar {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 18px;
      align-items: center;
      border-bottom: 1px solid var(--line);
      background: #0d0d0d;
      padding: 18px 22px;
    }

    .title-block {
      min-width: 0;
    }

    h1 {
      margin: 0;
      font-size: 22px;
      line-height: 1.15;
      letter-spacing: 0;
    }

    .subtitle {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-button {
      display: grid;
      width: 34px;
      height: 34px;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #151515;
      color: #d8d8d8;
    }

    .icon-button:hover {
      border-color: var(--line-strong);
      background: #202020;
      color: #ffffff;
    }

    .layout {
      display: grid;
      min-height: 0;
      grid-template-columns: 280px minmax(0, 1fr);
    }

    aside {
      min-height: 0;
      overflow: auto;
      border-right: 1px solid var(--line);
      background: #101010;
      padding: 16px;
    }

    main {
      min-height: 0;
      overflow: auto;
      padding: 18px;
    }

    .metric-list {
      display: grid;
      gap: 10px;
      margin-bottom: 18px;
    }

    .metric {
      display: grid;
      gap: 8px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      padding: 12px;
    }

    .metric-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      color: var(--muted);
      font-size: 12px;
    }

    .metric strong {
      color: var(--text);
      font-size: 20px;
    }

    .bar {
      height: 6px;
      overflow: hidden;
      border-radius: 99px;
      background: #272727;
    }

    .bar span {
      display: block;
      height: 100%;
      width: 0;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--accent), var(--good));
      transition: width 160ms ease;
    }

    .control-panel {
      display: grid;
      gap: 12px;
    }

    .field {
      display: grid;
      gap: 6px;
    }

    label,
    .label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 650;
    }

    input,
    select,
    textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #0b0b0b;
      color: var(--text);
      outline: none;
      padding: 9px 10px;
    }

    textarea {
      min-height: 76px;
      resize: vertical;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: #6a6a6a;
      box-shadow: 0 0 0 2px rgba(143, 183, 255, 0.12);
    }

    .segmented {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #0b0b0b;
    }

    .segmented button {
      min-width: 0;
      border: 0;
      border-right: 1px solid var(--line);
      background: transparent;
      color: var(--muted);
      padding: 8px 6px;
      font-size: 12px;
    }

    .segmented button:last-child {
      border-right: 0;
    }

    .segmented button.active {
      background: #252525;
      color: var(--text);
    }

    .command {
      display: inline-flex;
      min-height: 36px;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #1b1b1b;
      color: var(--text);
      padding: 0 12px;
    }

    .command:hover {
      border-color: var(--line-strong);
      background: #242424;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(4, minmax(220px, 1fr));
      gap: 14px;
      align-items: start;
    }

    .column {
      display: grid;
      min-width: 0;
      gap: 10px;
    }

    .column-header {
      display: flex;
      min-height: 34px;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      border-bottom: 1px solid var(--line);
      color: var(--muted);
    }

    .column-title {
      display: inline-flex;
      min-width: 0;
      align-items: center;
      gap: 8px;
      font-weight: 750;
      color: var(--text);
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--soft);
    }

    .dot.beta { background: var(--accent); }
    .dot.product { background: var(--good); }
    .dot.video { background: var(--warn); }
    .dot.ops { background: var(--danger); }

    .count {
      color: var(--muted);
      font-size: 12px;
    }

    .task-list {
      display: grid;
      gap: 8px;
    }

    .task {
      display: grid;
      gap: 9px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      padding: 10px;
      box-shadow: 0 10px 28px var(--shadow);
    }

    .task.done {
      opacity: 0.58;
    }

    .task-top {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      gap: 8px;
      align-items: start;
    }

    .check {
      display: grid;
      width: 20px;
      height: 20px;
      place-items: center;
      border: 1px solid var(--line-strong);
      border-radius: 5px;
      background: #101010;
      color: transparent;
      margin-top: 1px;
    }

    .task.done .check {
      border-color: color-mix(in srgb, var(--good) 70%, var(--line));
      background: color-mix(in srgb, var(--good) 18%, #101010);
      color: var(--good);
    }

    .task-title {
      min-width: 0;
      color: var(--text);
      font-weight: 680;
      line-height: 1.28;
      word-break: break-word;
    }

    .task-note {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
      word-break: break-word;
    }

    .task-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      padding: 3px 7px;
      font-size: 11px;
    }

    .priority-high { color: var(--danger); }
    .priority-med { color: var(--warn); }
    .priority-low { color: var(--soft); }

    .task-actions {
      display: flex;
      gap: 3px;
    }

    .tiny {
      display: grid;
      width: 24px;
      height: 24px;
      place-items: center;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: var(--muted);
    }

    .tiny:hover {
      background: #252525;
      color: var(--text);
    }

    .empty {
      border: 1px dashed var(--line);
      border-radius: 8px;
      color: var(--soft);
      padding: 18px 12px;
      text-align: center;
      font-size: 12px;
    }

    dialog {
      width: min(520px, calc(100vw - 28px));
      border: 1px solid var(--line-strong);
      border-radius: 10px;
      background: #131313;
      color: var(--text);
      padding: 0;
      box-shadow: 0 22px 80px rgba(0, 0, 0, 0.58);
    }

    dialog::backdrop {
      background: rgba(0, 0, 0, 0.62);
      backdrop-filter: blur(2px);
    }

    .dialog-body {
      display: grid;
      gap: 13px;
      padding: 18px;
    }

    .dialog-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .dialog-header h2 {
      margin: 0;
      font-size: 17px;
    }

    .dialog-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .dialog-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      border-top: 1px solid var(--line);
      padding-top: 14px;
    }

    @media (max-width: 1120px) {
      .board {
        grid-template-columns: repeat(2, minmax(220px, 1fr));
      }
    }

    @media (max-width: 760px) {
      .topbar,
      .layout {
        grid-template-columns: 1fr;
      }

      .top-actions {
        justify-content: start;
      }

      aside {
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      .board {
        grid-template-columns: 1fr;
      }

      .dialog-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="title-block">
        <h1>Misty Beta Launch Tracker</h1>
        <p class="subtitle">Private beta, launch readiness, and demo video work in one local board.</p>
      </div>
      <div class="top-actions">
        <button class="icon-button" id="exportBtn" title="Export tasks" aria-label="Export tasks">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
        </button>
        <button class="icon-button" id="resetBtn" title="Reset sample tasks" aria-label="Reset sample tasks">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v6h6"/></svg>
        </button>
        <button class="command" id="newTaskBtn">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
          New task
        </button>
      </div>
    </header>

    <div class="layout">
      <aside>
        <section class="metric-list" aria-label="Progress">
          <div class="metric">
            <div class="metric-row"><span>Overall</span><strong id="overallPct">0%</strong></div>
            <div class="bar"><span id="overallBar"></span></div>
          </div>
          <div class="metric">
            <div class="metric-row"><span>Open tasks</span><strong id="openCount">0</strong></div>
            <div class="metric-row"><span>High priority</span><strong id="highCount">0</strong></div>
          </div>
        </section>

        <section class="control-panel" aria-label="Controls">
          <div class="field">
            <label for="searchInput">Search</label>
            <input id="searchInput" type="search" placeholder="Find task, note, owner..." />
          </div>

          <div class="field">
            <span class="label">Status</span>
            <div class="segmented" role="group" aria-label="Status filter">
              <button type="button" class="active" data-status="all">All</button>
              <button type="button" data-status="open">Open</button>
              <button type="button" data-status="done">Done</button>
            </div>
          </div>

          <div class="field">
            <label for="categoryFilter">Category</label>
            <select id="categoryFilter">
              <option value="all">All categories</option>
              <option value="beta">Private beta</option>
              <option value="product">Product polish</option>
              <option value="video">Demo video</option>
              <option value="ops">Launch ops</option>
            </select>
          </div>

          <div class="field">
            <label for="ownerFilter">Owner</label>
            <input id="ownerFilter" placeholder="Anyone" />
          </div>
        </section>
      </aside>

      <main>
        <section class="board" id="board" aria-label="Task board"></section>
      </main>
    </div>
  </div>

  <dialog id="taskDialog">
    <form method="dialog" class="dialog-body" id="taskForm">
      <div class="dialog-header">
        <h2 id="dialogTitle">New task</h2>
        <button class="tiny" type="button" id="closeDialogBtn" title="Close" aria-label="Close">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </div>

      <input type="hidden" id="taskId" />
      <div class="field">
        <label for="taskTitle">Task</label>
        <input id="taskTitle" required placeholder="Ship signed beta build" />
      </div>
      <div class="field">
        <label for="taskNote">Notes</label>
        <textarea id="taskNote" placeholder="What needs to be true for this to count as done?"></textarea>
      </div>
      <div class="dialog-grid">
        <div class="field">
          <label for="taskCategory">Category</label>
          <select id="taskCategory">
            <option value="beta">Private beta</option>
            <option value="product">Product polish</option>
            <option value="video">Demo video</option>
            <option value="ops">Launch ops</option>
          </select>
        </div>
        <div class="field">
          <label for="taskPriority">Priority</label>
          <select id="taskPriority">
            <option value="high">High</option>
            <option value="med">Medium</option>
            <option value="low">Low</option>
          </select>
        </div>
        <div class="field">
          <label for="taskOwner">Owner</label>
          <input id="taskOwner" placeholder="Matt" />
        </div>
        <div class="field">
          <label for="taskDue">Due</label>
          <input id="taskDue" type="date" />
        </div>
      </div>

      <div class="dialog-actions">
        <button class="command" type="button" id="cancelBtn">Cancel</button>
        <button class="command" type="submit">Save</button>
      </div>
    </form>
  </dialog>

  <script>
    const storageKey = "misty.betaLaunchTracker.tasks.v1";
    const categories = [
      { id: "beta", label: "Private beta" },
      { id: "product", label: "Product polish" },
      { id: "video", label: "Demo video" },
      { id: "ops", label: "Launch ops" },
    ];

    const defaultTasks = [
      { title: "Pick 10-20 beta testers", note: "Developers, designers, remote-storage power users, and a few less technical file-heavy users.", category: "beta", priority: "high", owner: "Matt", due: "", done: false },
      { title: "Create beta invite email", note: "Set expectations: private build, rough edges, direct feedback wanted.", category: "beta", priority: "med", owner: "Matt", due: "", done: false },
      { title: "Write a 5-minute onboarding checklist", note: "Install, open Files, add remote, transfer a file, inspect Transfers, try panes.", category: "beta", priority: "high", owner: "Matt", due: "", done: false },
      { title: "Set up feedback channel", note: "One clear place for bug reports, confusion, and feature requests.", category: "beta", priority: "high", owner: "Matt", due: "", done: false },
      { title: "Make known issues doc", note: "Short, honest, and linked from the beta invite.", category: "beta", priority: "med", owner: "Matt", due: "", done: false },
      { title: "Stabilize Files first-run flow", note: "No layout bugs in tabs, panes, sidebar, preview, remotes, and transfers.", category: "product", priority: "high", owner: "Matt", due: "", done: false },
      { title: "Polish empty/loading/error states", note: "Especially remotes, transfer history, failed auth, and empty folders.", category: "product", priority: "high", owner: "Matt", due: "", done: false },
      { title: "Confirm beta build/update path", note: "Make sure testers can install and get fixes without manual confusion.", category: "ops", priority: "high", owner: "Matt", due: "", done: false },
      { title: "Define success signals", note: "Added a remote, completed a transfer, returned next day, sent feedback.", category: "ops", priority: "med", owner: "Matt", due: "", done: false },
      { title: "Draft 90-second demo script", note: "Pain, local files, remote, transfer, tabs/panes, ending line.", category: "video", priority: "high", owner: "Matt", due: "", done: false },
      { title: "Record clean product walkthrough", note: "Use a realistic folder and remote. Avoid fake marketing language.", category: "video", priority: "high", owner: "Matt", due: "", done: false },
      { title: "Cut 15-second launch clip", note: "Reusable teaser for Product Hunt and social posts.", category: "video", priority: "med", owner: "Matt", due: "", done: false },
    ];

    let tasks = loadTasks();
    let statusFilter = "all";

    const board = document.getElementById("board");
    const searchInput = document.getElementById("searchInput");
    const categoryFilter = document.getElementById("categoryFilter");
    const ownerFilter = document.getElementById("ownerFilter");
    const taskDialog = document.getElementById("taskDialog");
    const taskForm = document.getElementById("taskForm");

    document.getElementById("newTaskBtn").addEventListener("click", () => openTaskDialog());
    document.getElementById("closeDialogBtn").addEventListener("click", () => taskDialog.close());
    document.getElementById("cancelBtn").addEventListener("click", () => taskDialog.close());
    document.getElementById("exportBtn").addEventListener("click", exportTasks);
    document.getElementById("resetBtn").addEventListener("click", resetTasks);
    searchInput.addEventListener("input", render);
    categoryFilter.addEventListener("change", render);
    ownerFilter.addEventListener("input", render);

    document.querySelectorAll("[data-status]").forEach((button) => {
      button.addEventListener("click", () => {
        statusFilter = button.dataset.status;
        document.querySelectorAll("[data-status]").forEach((candidate) => {
          candidate.classList.toggle("active", candidate === button);
        });
        render();
      });
    });

    taskForm.addEventListener("submit", (event) => {
      event.preventDefault();
      const id = document.getElementById("taskId").value || createId();
      const existing = tasks.find((task) => task.id === id);
      const nextTask = {
        id,
        title: document.getElementById("taskTitle").value.trim(),
        note: document.getElementById("taskNote").value.trim(),
        category: document.getElementById("taskCategory").value,
        priority: document.getElementById("taskPriority").value,
        owner: document.getElementById("taskOwner").value.trim(),
        due: document.getElementById("taskDue").value,
        done: existing ? existing.done : false,
      };
      if (!nextTask.title) return;
      tasks = existing
        ? tasks.map((task) => task.id === id ? nextTask : task)
        : [nextTask, ...tasks];
      saveTasks();
      taskDialog.close();
      render();
    });

    function loadTasks() {
      try {
        const raw = localStorage.getItem(storageKey);
        if (!raw) return seedTasks();
        const parsed = JSON.parse(raw);
        return Array.isArray(parsed) ? parsed : seedTasks();
      } catch {
        return seedTasks();
      }
    }

    function seedTasks() {
      return defaultTasks.map((task) => ({ ...task, id: createId() }));
    }

    function saveTasks() {
      localStorage.setItem(storageKey, JSON.stringify(tasks));
    }

    function createId() {
      return `${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 8)}`;
    }

    function filteredTasks() {
      const query = searchInput.value.trim().toLowerCase();
      const category = categoryFilter.value;
      const owner = ownerFilter.value.trim().toLowerCase();
      return tasks.filter((task) => {
        if (statusFilter === "open" && task.done) return false;
        if (statusFilter === "done" && !task.done) return false;
        if (category !== "all" && task.category !== category) return false;
        if (owner && !task.owner.toLowerCase().includes(owner)) return false;
        if (!query) return true;
        return [task.title, task.note, task.owner, task.priority, task.category, task.due]
          .join(" ")
          .toLowerCase()
          .includes(query);
      });
    }

    function render() {
      const visible = filteredTasks();
      board.innerHTML = categories.map((category) => {
        const list = visible.filter((task) => task.category === category.id);
        return `
          <section class="column" aria-label="${escapeHtml(category.label)}">
            <header class="column-header">
              <span class="column-title"><span class="dot ${category.id}"></span>${escapeHtml(category.label)}</span>
              <span class="count">${list.length}</span>
            </header>
            <div class="task-list">
              ${list.length ? list.map(taskTemplate).join("") : `<div class="empty">No matching tasks.</div>`}
            </div>
          </section>
        `;
      }).join("");
      updateMetrics();
    }

    function taskTemplate(task) {
      const priorityClass = `priority-${task.priority}`;
      const due = task.due ? `<span class="chip">${escapeHtml(task.due)}</span>` : "";
      const owner = task.owner ? `<span class="chip">${escapeHtml(task.owner)}</span>` : "";
      return `
        <article class="task ${task.done ? "done" : ""}" data-id="${task.id}">
          <div class="task-top">
            <button class="check" title="Toggle done" aria-label="Toggle done" onclick="toggleDone('${task.id}')">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="m5 13 4 4L19 7"/></svg>
            </button>
            <div class="task-title">${escapeHtml(task.title)}</div>
            <div class="task-actions">
              <button class="tiny" title="Edit" aria-label="Edit" onclick="editTask('${task.id}')">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
              </button>
              <button class="tiny" title="Delete" aria-label="Delete" onclick="deleteTask('${task.id}')">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/></svg>
              </button>
            </div>
          </div>
          ${task.note ? `<p class="task-note">${escapeHtml(task.note)}</p>` : ""}
          <div class="task-meta">
            <span class="chip ${priorityClass}">${escapeHtml(priorityLabel(task.priority))}</span>
            ${owner}
            ${due}
          </div>
        </article>
      `;
    }

    function updateMetrics() {
      const done = tasks.filter((task) => task.done).length;
      const total = tasks.length;
      const pct = total ? Math.round((done / total) * 100) : 0;
      document.getElementById("overallPct").textContent = `${pct}%`;
      document.getElementById("overallBar").style.width = `${pct}%`;
      document.getElementById("openCount").textContent = String(tasks.filter((task) => !task.done).length);
      document.getElementById("highCount").textContent = String(tasks.filter((task) => !task.done && task.priority === "high").length);
    }

    function openTaskDialog(task) {
      document.getElementById("dialogTitle").textContent = task ? "Edit task" : "New task";
      document.getElementById("taskId").value = task ? task.id : "";
      document.getElementById("taskTitle").value = task ? task.title : "";
      document.getElementById("taskNote").value = task ? task.note : "";
      document.getElementById("taskCategory").value = task ? task.category : "beta";
      document.getElementById("taskPriority").value = task ? task.priority : "high";
      document.getElementById("taskOwner").value = task ? task.owner : "Matt";
      document.getElementById("taskDue").value = task ? task.due : "";
      taskDialog.showModal();
      document.getElementById("taskTitle").focus();
    }

    function priorityLabel(priority) {
      if (priority === "high") return "High";
      if (priority === "med") return "Medium";
      return "Low";
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function exportTasks() {
      const blob = new Blob([JSON.stringify(tasks, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const anchor = document.createElement("a");
      anchor.href = url;
      anchor.download = "misty-beta-launch-tasks.json";
      anchor.click();
      URL.revokeObjectURL(url);
    }

    function resetTasks() {
      if (!confirm("Reset this tracker to the starter beta launch checklist?")) return;
      tasks = seedTasks();
      saveTasks();
      render();
    }

    window.toggleDone = (id) => {
      tasks = tasks.map((task) => task.id === id ? { ...task, done: !task.done } : task);
      saveTasks();
      render();
    };

    window.editTask = (id) => {
      const task = tasks.find((candidate) => candidate.id === id);
      if (task) openTaskDialog(task);
    };

    window.deleteTask = (id) => {
      tasks = tasks.filter((task) => task.id !== id);
      saveTasks();
      render();
    };

    render();
  </script>
</body>
</html>
