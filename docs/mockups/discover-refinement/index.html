const apps=[
{name:'Social',icon:'MessageCircle',desc:'Conversations with people and agents.',category:'Productivity',action:'Add',recovery:true},
{name:'Journal',icon:'BookOpen',desc:'Notes and drawings, side by side.',category:'Creative',action:'Add',recovery:true},
{name:'Planner',icon:'ListTodo',desc:'Tasks, calendars, and roadmaps.',category:'Productivity',action:'Review'},
{name:'Library',icon:'Library',desc:'A shared home for project resources.',category:'Creative',action:'Open'},
{name:'Inbox',icon:'Inbox',desc:'Mail and conversations to follow up.',category:'Productivity',action:'Open'},
{name:'Agents',icon:'Bot',desc:'Create and manage AI collaborators.',category:'Productivity',action:'Open'},
{name:'Files',icon:'Folder',desc:'Local files and connected storage.',category:'Utilities',action:'Open'},
{name:'Browser',icon:'Globe',desc:'Research beside your work.',category:'Utilities',action:'Open'},
{name:'Code',icon:'Code',desc:'Your project, editor, and terminal.',category:'Utilities',action:'Add'},
{name:'Terminal',icon:'Terminal',desc:'A shell inside your workspace.',category:'Utilities',action:'Open'}];
let section='apps',category='All',selected,previousFocus,timer;
const $=s=>document.querySelector(s);
function render(){const query=$('#search').value.trim().toLowerCase();const visible=apps.filter(a=>(section!=='installed'||a.action!=='Add')&&(category==='All'||a.category===category)&&(`${a.name} ${a.desc}`.toLowerCase().includes(query)));$('#catalog').innerHTML=visible.length?visible.map(a=>`<article class="app-row"><button class="details" data-detail="${a.name}" aria-label="View ${a.name} details"><span class="app-icon">${icons[a.icon]}</span><span class="app-copy"><span class="app-name">${a.name}</span><span class="app-desc">${a.desc}</span></span></button><div class="action-wrap"><button class="action ${a.action.toLowerCase()}" data-action="${a.name}" aria-label="${a.action} ${a.name}">${a.action}</button>${a.action==='Review'?'<div class="review-note">New permissions</div>':''}</div></article>`).join(''):'<div class="empty"><b>No matching apps</b>Try another name or category.</div>';$('#total').textContent=visible.length;$('#installedCount').textContent=apps.filter(a=>a.action!=='Add').length;$('.previews').hidden=!!query||category!=='All'||section==='installed';$('.previews').style.display=$('.previews').hidden?'none':'grid';}
function toast(message){$('#toast').textContent=message;$('#toast').hidden=false;clearTimeout(timer);timer=setTimeout(()=>$('#toast').hidden=true,2500)}
function detail(name){selected=apps.find(a=>a.name===name);previousFocus=document.activeElement;$('#dialog-title').textContent=selected.name;$('#dialog-icon').innerHTML=icons[selected.icon];$('#dialog-summary').textContent=selected.desc;$('#dialog-info').innerHTML=selected.action==='Review'?'<strong>Review new permissions</strong>Show the exact newly requested permissions here, before the update can be approved. Existing access stays unchanged until you approve.':`<strong>About this app</strong>Official Misty app · ${selected.category}<br>Version, download size, and device support belong here.${selected.recovery?'<br><br>Your saved app data is still recoverable. Adding the app restores it.':''}`;$('#confirm').textContent=selected.action==='Review'?'Review permissions':selected.action;$('#shade').hidden=false;$('#close').focus()}
function close(){ $('#shade').hidden=true;previousFocus?.focus() }
document.addEventListener('click',e=>{const d=e.target.closest('[data-detail]');if(d)return detail(d.dataset.detail);const a=e.target.closest('[data-action]');if(a){const app=apps.find(x=>x.name===a.dataset.action);return app.action==='Open'?toast(`${app.name} would open in your workspace.`):detail(app.name)}const n=e.target.closest('[data-section]');if(n){section=n.dataset.section;document.querySelectorAll('.nav').forEach(b=>{b.classList.toggle('active',b===n);b.toggleAttribute('aria-current',b===n);if(b===n)b.setAttribute('aria-current','page')});$('#title').textContent={apps:'Apps',featured:'Featured',installed:'Installed'}[section];$('#intro').textContent=section==='installed'?'The apps in your workspace.':section==='featured'?'A closer look at Library and Journal.':'Choose what belongs in your workspace.';render()}const c=e.target.closest('[data-category]');if(c){category=c.dataset.category;document.querySelectorAll('.category').forEach(b=>{b.classList.toggle('active',b===c);b.setAttribute('aria-pressed',String(b===c))});render()}});
$('#search').addEventListener('input',render);$('#close').onclick=close;$('#cancel').onclick=close;$('#shade').onclick=e=>{if(e.target===$('#shade'))close()};$('#confirm').onclick=()=>{if(selected.action==='Review'){toast('The real update would list its requested permissions for approval.');return}if(selected.action==='Add'){selected.action='Open';render();toast(`${selected.name} added in this preview.`)}else toast(`${selected.name} would open in your workspace.`);close()};document.addEventListener('keydown',e=>{if(e.key==='Escape')close();if(e.key==='/'&&e.target.tagName!=='INPUT'&&$('#shade').hidden){e.preventDefault();$('#search').focus()}if(e.key==='Tab'&&!$('#shade').hidden){const f=Array.from($('.modal').querySelectorAll('button'));if(e.shiftKey&&document.activeElement===f[0]){e.preventDefault();f.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===f.at(-1)){e.preventDefault();f[0].focus()}}});render();
</script>
