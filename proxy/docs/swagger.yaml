definitions:
  rclone.ProviderChoice:
    properties:
      help:
        type: string
      value:
        type: string
    type: object
  rclone.ProviderOption:
    properties:
      choices:
        items:
          $ref: '#/definitions/rclone.ProviderChoice'
        type: array
      default:
        type: string
      help:
        type: string
      name:
        type: string
      password:
        type: boolean
      required:
        type: boolean
    type: object
  rclone.ProviderStep:
    properties:
      done:
        type: boolean
      error:
        type: string
      kind:
        type: string
      name:
        type: string
      option:
        $ref: '#/definitions/rclone.ProviderOption'
      result:
        type: string
      state:
        type: string
    type: object
  rclone.ProviderType:
    properties:
      name:
        type: string
      type:
        type: string
    type: object
  rclone.ProviderWorkflow:
    properties:
      description:
        type: string
      name:
        type: string
      options:
        items:
          $ref: '#/definitions/rclone.ProviderOption'
        type: array
      type:
        type: string
    type: object
  rclone.RemoteInfo:
    properties:
      name:
        type: string
      type:
        type: string
    type: object
  remote.providerConfigRequest:
    properties:
      name:
        type: string
      parameters:
        additionalProperties:
          type: string
        type: object
      result:
        type: string
      state:
        type: string
      type:
        type: string
    type: object
info:
  contact: {}
paths:
  /file/download:
    get:
      parameters:
      - description: Remote name
        in: query
        name: remote
        required: true
        type: string
      - description: Remote path
        in: query
        name: path
        required: true
        type: string
      produces:
      - application/octet-stream
      responses:
        "200":
          description: OK
          schema:
            type: file
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            type: string
        "502":
          description: Bad Gateway
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Download a file from a configured remote
      tags:
      - files
  /remotes:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/rclone.RemoteInfo'
            type: array
        "401":
          description: Unauthorized
          schema:
            type: string
        "502":
          description: Bad Gateway
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: List configured remotes
      tags:
      - remotes
  /remotes/config/continue:
    post:
      consumes:
      - application/json
      parameters:
      - description: Provider config continue request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/remote.providerConfigRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/rclone.ProviderStep'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            type: string
        "502":
          description: Bad Gateway
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Continue provider config flow
      tags:
      - remotes
  /remotes/config/start:
    post:
      consumes:
      - application/json
      parameters:
      - description: Provider config start request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/remote.providerConfigRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/rclone.ProviderStep'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            type: string
        "502":
          description: Bad Gateway
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Start provider config flow
      tags:
      - remotes
  /remotes/health:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties: true
            type: object
      summary: Check rclone remote subsystem health
      tags:
      - remotes
  /remotes/types:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/rclone.ProviderType'
            type: array
        "401":
          description: Unauthorized
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: List supported provider types
      tags:
      - remotes
  /remotes/workflow:
    get:
      parameters:
      - description: Provider type
        enum:
        - drive
        - onedrive
        - dropbox
        in: query
        name: type
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/rclone.ProviderWorkflow'
        "401":
          description: Unauthorized
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get one provider workflow
      tags:
      - remotes
  /remotes/workflows:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/rclone.ProviderWorkflow'
            type: array
        "401":
          description: Unauthorized
          schema:
            type: string
        "502":
          description: Bad Gateway
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: List provider workflows
      tags:
      - remotes
swagger: "2.0"
