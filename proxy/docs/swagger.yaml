basePath: /api
definitions:
  rclone.FileItem:
    properties:
      hash:
        type: string
      hash_algo:
        type: string
      is_dir:
        type: boolean
      mime_type:
        type: string
      mod_time:
        type: string
      name:
        type: string
      path:
        type: string
      size:
        type: integer
    type: object
  rclone.ProviderChoice:
    properties:
      help:
        type: string
      value:
        type: string
    type: object
  rclone.ProviderOption:
    properties:
      choices:
        items:
          $ref: '#/definitions/rclone.ProviderChoice'
        type: array
      default:
        type: string
      help:
        type: string
      name:
        type: string
      password:
        type: boolean
      required:
        type: boolean
    type: object
  rclone.ProviderStep:
    properties:
      authorize_url:
        type: string
      done:
        type: boolean
      error:
        type: string
      instructions:
        type: string
      kind:
        type: string
      name:
        type: string
      option:
        $ref: '#/definitions/rclone.ProviderOption'
      poll_after_ms:
        type: integer
      result:
        type: string
      state:
        type: string
    type: object
  rclone.ProviderType:
    properties:
      name:
        type: string
      type:
        type: string
    type: object
  rclone.ProviderWorkflow:
    properties:
      description:
        type: string
      name:
        type: string
      options:
        items:
          $ref: '#/definitions/rclone.ProviderOption'
        type: array
      type:
        type: string
    type: object
  rclone.RemoteInfo:
    properties:
      name:
        type: string
      type:
        type: string
    type: object
  remote.providerConfigRequest:
    properties:
      name:
        type: string
      parameters:
        additionalProperties:
          type: string
        type: object
      result:
        type: string
      state:
        type: string
      type:
        type: string
    type: object
  remote.renameFileRequest:
    properties:
      new_path:
        type: string
      old_path:
        type: string
      remote:
        type: string
    type: object
info:
  contact: {}
  description: Misty proxy API for remote provider workflows and remote file operations.
  title: Misty Proxy API
  version: "1.0"
paths:
  /remote:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/rclone.RemoteInfo'
            type: array
        "401":
          description: Unauthorized
          schema:
            type: string
        "502":
          description: Bad Gateway
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: List configured remotes
      tags:
      - remotes
  /remote/config/continue:
    post:
      consumes:
      - application/json
      parameters:
      - description: Provider config continue request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/remote.providerConfigRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/rclone.ProviderStep'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            type: string
        "502":
          description: Bad Gateway
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Continue provider config flow
      tags:
      - remotes
  /remote/config/start:
    post:
      consumes:
      - application/json
      parameters:
      - description: Provider config start request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/remote.providerConfigRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/rclone.ProviderStep'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            type: string
        "502":
          description: Bad Gateway
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Start provider config flow
      tags:
      - remotes
  /remote/file:
    delete:
      parameters:
      - description: Remote name
        in: query
        name: remote
        required: true
        type: string
      - description: Remote file or directory path
        in: query
        name: path
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            type: string
        "502":
          description: Bad Gateway
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Delete a file or directory from a configured remote
      tags:
      - files
  /remote/file/download:
    get:
      parameters:
      - description: Remote name
        in: query
        name: remote
        required: true
        type: string
      - description: Remote path
        in: query
        name: path
        required: true
        type: string
      produces:
      - application/octet-stream
      responses:
        "200":
          description: OK
          schema:
            type: file
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            type: string
        "502":
          description: Bad Gateway
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Download a file from a configured remote
      tags:
      - files
  /remote/file/list:
    get:
      parameters:
      - description: Remote name
        in: query
        name: remote
        required: true
        type: string
      - description: Remote directory path
        in: query
        name: path
        required: false
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/rclone.FileItem'
            type: array
        "401":
          description: Unauthorized
          schema:
            type: string
        "502":
          description: Bad Gateway
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: List files in a configured remote directory
      tags:
      - files
  /remote/file/rename:
    post:
      consumes:
      - application/json
      parameters:
      - description: Rename file request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/remote.renameFileRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            type: string
        "502":
          description: Bad Gateway
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Rename or move a file within a configured remote
      tags:
      - files
  /remote/file/upload:
    post:
      consumes:
      - multipart/form-data
      parameters:
      - description: Remote name
        in: formData
        name: remote
        required: true
        type: string
      - description: Remote directory path
        in: formData
        name: path
        required: false
        type: string
      - description: File to upload
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            type: string
        "502":
          description: Bad Gateway
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Upload a file to a configured remote directory
      tags:
      - files
  /remote/health:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties: true
            type: object
      summary: Check rclone remote subsystem health
      tags:
      - remotes
  /remote/types:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/rclone.ProviderType'
            type: array
        "401":
          description: Unauthorized
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: List supported provider types
      tags:
      - remotes
  /remote/workflow:
    get:
      parameters:
      - description: Provider type
        enum:
        - drive
        - onedrive
        - dropbox
        in: query
        name: type
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/rclone.ProviderWorkflow'
        "401":
          description: Unauthorized
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get one provider workflow
      tags:
      - remotes
  /remote/workflows:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/rclone.ProviderWorkflow'
            type: array
        "401":
          description: Unauthorized
          schema:
            type: string
        "502":
          description: Bad Gateway
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: List provider workflows
      tags:
      - remotes
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
