services:
  postgres:
    image: postgres:16-alpine
    container_name: misty-postgres
    environment:
      POSTGRES_USER: misty
      POSTGRES_PASSWORD: misty
      POSTGRES_DB: misty
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  pgdata:
