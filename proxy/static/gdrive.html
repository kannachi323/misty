<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authorization - Misty</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #f0f4f8 0%, #e2e8f0 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            background: white;
            border-radius: 16px;
            padding: 48px;
            text-align: center;
            box-shadow: 0 4px 24px rgba(59, 130, 246, 0.1);
            max-width: 420px;
            width: 90%;
        }

        .icon {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
        }

        .icon.success {
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
        }

        .icon.error {
            background: linear-gradient(135deg, #94a3b8 0%, #64748b 100%);
        }

        .icon svg {
            width: 36px;
            height: 36px;
            color: white;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 8px;
        }

        h1.success {
            color: #1e40af;
        }

        h1.error {
            color: #475569;
        }

        .subtitle {
            color: #64748b;
            font-size: 0.95rem;
            margin-bottom: 32px;
        }

        .auto-close {
            margin-top: 24px;
            font-size: 0.95rem;
            color: #64748b;
        }

        .brand {
            margin-top: 32px;
            padding-top: 24px;
            border-top: 1px solid #e2e8f0;
            color: #94a3b8;
            font-size: 0.8rem;
            letter-spacing: 0.5px;
        }

        .brand span {
            color: #3b82f6;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon" id="icon">
            <!-- Icon will be inserted by JS -->
        </div>
        <h1 id="title">Loading...</h1>
        <p class="subtitle" id="subtitle"></p>
        <p class="auto-close">You can now close this tab</p>
        <div class="brand">Powered by <span>misty</span></div>
    </div>

    <script>
        const checkmarkSVG = `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
        </svg>`;

        const errorSVG = `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>`;

        // Success state is set by the server via template substitution
        const isSuccess = {{ success }};

        function init() {
            const icon = document.getElementById('icon');
            const title = document.getElementById('title');
            const subtitle = document.getElementById('subtitle');

            if (isSuccess) {
                icon.classList.add('success');
                icon.innerHTML = checkmarkSVG;
                title.textContent = 'You are now connected to Google Drive!';
                title.classList.add('success');
                subtitle.textContent = 'Please return back to misty';
            } else {
                icon.classList.add('error');
                icon.innerHTML = errorSVG;
                title.textContent = 'Could not connect';
                title.classList.add('error');
                subtitle.textContent = 'Authorization was not completed';
            }

        }

        init();
    </script>
</body>
</html>
