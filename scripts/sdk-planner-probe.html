<!doctype html>
<html><head><meta charset="utf-8"><title>Misty Planner SDK verification</title>
<link rel="stylesheet" href="/src/styles/styles.css">
<style>html,body{margin:0;height:100%;background:#111;color:#eee}#panes{display:flex;height:90vh}#panes>div{width:50%;height:100%;min-width:0}#result{display:block;font:12px system-ui;padding:8px}</style>
</head><body><div id="panes"><div id="a"></div><div id="b"></div></div><output id="result">Verifying downloaded Planner components…</output>
<script>
const report = (message) => {
 document.getElementById("result").textContent = message;
 void window.__TAURI_INTERNALS__?.invoke("sdk_probe_complete", {nonce:new URLSearchParams(location.search).get("nonce"),success:false,message});
};
window.addEventListener("error", event => report(event.message || "Planner failed to load"));
window.addEventListener("unhandledrejection", event => report(String(event.reason)));
</script>
<script type="module" src="./sdk-planner-probe.ts"></script></body></html>
