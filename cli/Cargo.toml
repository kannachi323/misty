[package]
name = "misty-cli"
version = "0.1.0"
edition = "2021"
description = "Local development and release tooling for Misty"
license = "MIT"

[dependencies]
anyhow = "1.0.98"
base64 = "0.22.1"
chrono = { version = "0.4.41", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.5.40", features = ["derive"] }
dirs = "6.0.0"
dotenvy = "0.15.7"
ed25519-dalek = { version = "2.1.1", features = ["pkcs8", "rand_core"] }
minisign-verify = "0.2.5"
rand = "0.8.5"
regex = "1.11.1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.10.9"
tempfile = "3.20.0"
toml = "0.8.23"
url = "2.5.4"
walkdir = "2.5.0"

[dev-dependencies]
assert_cmd = "2.0.17"
predicates = "3.1.3"
