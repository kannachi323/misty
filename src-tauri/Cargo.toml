[package]
name = "misty-desktop"
version = "0.1.0"
description = "Misty Tauri desktop shell"
authors = ["Misty Contributors"]
edition = "2021"

[lib]
crate-type = ["staticlib", "cdylib", "lib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
aes-gcm = "0.10"
axum = "0.8"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dirs = "6.0.0"
hex = "0.4"
jsonwebtoken = "9"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tantivy = "0.25"
tauri = { version = "2", features = ["protocol-asset", "macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
tauri-plugin-os = "2"
thiserror = "1"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls", "stream"] }
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
walkdir = "2.5"
image = { version = "0.25.10", default-features = false, features = ["bmp", "gif", "hdr", "jpeg", "png", "pnm", "tga", "webp"] }
libloading = "0.8"
zip = { version = "2", default-features = false, features = ["deflate"] }
zune-psd = "0.5.1"
tauri-plugin-keystore = { path = "vendor/tauri-plugin-keystore" }
tauri-plugin-document-tree = { path = "vendor/tauri-plugin-document-tree" }
tauri-plugin-deep-link = "2"

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.26"
objc = "0.2.7"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSPasteboard"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSDictionary", "NSString", "NSURL"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
embedded-proxy-go = []
