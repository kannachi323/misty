[package]
name = "tauri-plugin-keystore"
version = "2.1.0-alpha.1-misty.1"
edition = "2021"
rust-version = "1.77.2"
build = "build.rs"
links = "tauri-plugin-keystore"
description = "Misty's device-native secure token storage plugin."
license = "Apache-2.0"

[lib]
name = "tauri_plugin_keystore"
path = "src/lib.rs"

[dependencies]
# Each target OS needs its native credential store enabled explicitly. Without
# the matching feature keyring 3.x silently falls back to an in-memory "mock"
# store on that platform, so tokens never persist across restarts (root cause of
# the Windows "log in every launch" bug). apple-native -> macOS/iOS Keychain,
# windows-native -> Windows Credential Manager. For Linux, add a secret-service
# feature plus a crypto provider, e.g. "sync-secret-service" + "crypto-rust".
keyring = { version = "3", features = ["apple-native", "windows-native"] }
serde = { version = "1", features = ["derive"] }
tauri = "2.2.4"
thiserror = "2"

[build-dependencies]
tauri-plugin = { version = "2.0.3", features = ["build"] }
