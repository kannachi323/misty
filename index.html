<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Misty</title>
    <style>
      /*
        Paints the window's real background before any JS runs. The Tauri
        window is transparent with no OS chrome, so without this the OS
        shows through as a black flash for however long it takes the app
        bundle to load and mount (worse in `tauri dev`, where a refresh
        re-fetches the whole module graph unbundled from Vite).
      */
      html,
      body {
        margin: 0;
        height: 100%;
        background: oklch(1 0 0);
      }
      @media (prefers-color-scheme: dark) {
        html,
        body {
          background: oklch(0.141 0.005 285.823);
        }
      }
      #root {
        height: 100%;
      }
    </style>
  </head>
  <body>
    <!--
      THESIS: Marketplace is a navigation-led storefront that separates built-in Apps from installable Extensions instead of flattening both into one catalog grid.
      OWN-WORLD: Misty's charcoal ladder, cream system type, hairline dividers, compact controls, and Store / Layout Grid / Blocks identities carry every region.
      STORY: Users discover a featured extension, understand the two inventory types, browse curated shelves, then open, install, or manage with truthful permissions in view.
      FIRST VIEWPORT: A 172px local rail anchors Home, Apps, Extensions, and Installed; a search-led header sits over the featured extension, two browse paths, and separate shelves.
      FORM: Navigation-led storefront, ordered candidate 3, seed 8c8efcc9.
      FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance
    -->
    <div id="root"></div>
    <script type="module" src="/src/application/main.tsx"></script>
  </body>
</html>
