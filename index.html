<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/misty.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Misty — One Space for the whole project</title>
    <meta
      name="description"
      content="Misty combines members, chat, tasks, and a shared Library in one project Space. Private Files stay private until shared."
    />
    <meta name="theme-color" content="#18181b" />
    <link rel="canonical" href="https://mistysys.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Misty" />
    <meta property="og:title" content="Misty — One Space for the whole project" />
    <meta
      property="og:description"
      content="Misty combines members, chat, tasks, and a shared Library in one project Space. Private Files stay private until shared."
    />
    <meta property="og:url" content="https://mistysys.com/" />
    <meta property="og:image" content="https://mistysys.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Misty — one Space for the whole project" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Misty — One Space for the whole project" />
    <meta
      name="twitter:description"
      content="Misty combines members, chat, tasks, and a shared Library in one project Space. Private Files stay private until shared."
    />
    <meta name="twitter:image" content="https://mistysys.com/og.png" />
    <script>
      (() => {
        try {
          const storedTheme = localStorage.getItem("misty-ui-theme");
          const theme = storedTheme === "light" ? "light" : "dark";
          document.documentElement.classList.add(theme);
          document.documentElement.style.colorScheme = theme;
        } catch {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
