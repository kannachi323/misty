name: Release Extension Bundles

on:
  push:
    tags:
      - "extensions-v*"

permissions:
  contents: write

jobs:
  bundle:
    strategy:
      matrix:
        include:
          - os: macos-14
            targets: macos-aarch64,macos-x86_64
          - os: windows-2025
            targets: windows-x86_64
          - os: ubuntu-24.04
            targets: linux-x86_64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: extensions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        working-directory: .
      - name: Verify release tag matches package version
        shell: bash
        run: test "${GITHUB_REF_NAME}" = "extensions-v$(node -p 'require(\"./package.json\").version')"
      - run: npm test
      - run: npm run validate
      - run: npm run build
      - name: Download verified extension toolchain
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.TOOLCHAIN_GITHUB_TOKEN || github.token }}
          TARGETS: ${{ matrix.targets }}
        run: |
          IFS=',' read -ra platforms <<< "$TARGETS"
          for platform in "${platforms[@]}"; do
            mkdir -p "tool-cache/$platform"
            gh release download toolchain-2026.07 -R misty-org/misty-extension-toolchain -p "$platform.tar.gz" -p "$platform.tar.gz.sha256" -D "tool-cache/$platform"
            (cd "tool-cache/$platform" && shasum -a 256 -c "$platform.tar.gz.sha256" && tar -xzf "$platform.tar.gz" && rm "$platform.tar.gz" "$platform.tar.gz.sha256")
          done
      - name: Sign macOS tools
        if: runner.os == 'macOS'
        shell: bash
        env:
          CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          if [ -z "$CERTIFICATE_P12" ]; then echo "Signing credentials unavailable; refusing unsigned production release."; exit 1; fi
          echo "$CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/misty-cert.p12"
          security create-keychain -p temporary "$RUNNER_TEMP/misty.keychain"
          security import "$RUNNER_TEMP/misty-cert.p12" -k "$RUNNER_TEMP/misty.keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k temporary "$RUNNER_TEMP/misty.keychain"
          find tool-cache -type f -perm -111 -exec codesign --force --timestamp --options runtime --sign "$SIGNING_IDENTITY" {} \;
      - name: Sign Windows tools
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CERTIFICATE_PFX: ${{ secrets.WINDOWS_CERTIFICATE_PFX }}
          CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:CERTIFICATE_PFX) { throw "Signing credentials unavailable; refusing unsigned production release." }
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\misty.pfx", [Convert]::FromBase64String($env:CERTIFICATE_PFX))
          Get-ChildItem tool-cache -Recurse -Filter *.exe | ForEach-Object { signtool sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /f "$env:RUNNER_TEMP\misty.pfx" /p $env:CERTIFICATE_PASSWORD $_.FullName }
      - name: Create catalog-enumerated install bundles
        shell: bash
        env:
          TARGET_PLATFORMS: ${{ matrix.targets }}
        run: npm run package:release
      - name: Notarize macOS bundles
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER }}
        run: |
          if [ -z "$APPLE_NOTARY_KEY_ID" ]; then echo "Notarization credentials unavailable; refusing unnotarized production release."; exit 1; fi
          printf '%s' "$APPLE_NOTARY_KEY" > "$RUNNER_TEMP/AuthKey.p8"
          for bundle in artifacts/*-macos-*.zip; do xcrun notarytool submit "$bundle" --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$APPLE_NOTARY_KEY_ID" --issuer "$APPLE_NOTARY_ISSUER" --wait; done
      - uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ runner.os }}
          path: extensions/artifacts
  release:
    needs: bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: bundles-*
          path: artifacts
          merge-multiple: true
      - name: Publish bundles
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --generate-notes
          gh release upload "${GITHUB_REF_NAME}" artifacts/*.zip --clobber
          gh release upload "${GITHUB_REF_NAME}" artifacts/*.sha256 artifacts/catalog/*.json --clobber
