name: Publish macOS DMG

on:
  workflow_dispatch:
    inputs:
      notarize:
        description: Notarize and staple the DMG
        required: false
        default: true
        type: boolean
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish-macos-dmg:
    runs-on: macos-14

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: proxy/go.mod
          cache-dependency-path: proxy/go.sum

      - name: Validate signing and notarization secrets
        env:
          MACOS_DEVELOPER_ID: ${{ secrets.MACOS_DEVELOPER_ID }}
          MACOS_DEVELOPER_ID_CERT_P12: ${{ secrets.MACOS_DEVELOPER_ID_CERT_P12 }}
          MACOS_DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_CERT_PASSWORD }}
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_APP_PASSWORD: ${{ secrets.MACOS_NOTARY_APP_PASSWORD }}
          MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
        run: |
          notarize=false
          if [[ "${{ github.event_name }}" == "push" ]]; then
            notarize=true
          elif [[ "${{ inputs.notarize }}" == "true" ]]; then
            notarize=true
          fi

          missing=()
          for secret_name in \
            MACOS_DEVELOPER_ID \
            MACOS_DEVELOPER_ID_CERT_P12 \
            MACOS_DEVELOPER_ID_CERT_PASSWORD
          do
            if [[ -z "${!secret_name:-}" ]]; then
              missing+=("$secret_name")
            fi
          done

          if [[ "$notarize" == "true" ]]; then
            for secret_name in \
              MACOS_NOTARY_APPLE_ID \
              MACOS_NOTARY_APP_PASSWORD \
              MACOS_NOTARY_TEAM_ID
            do
              if [[ -z "${!secret_name:-}" ]]; then
                missing+=("$secret_name")
              fi
            done
          fi

          if (( ${#missing[@]} > 0 )); then
            printf 'error: missing required GitHub Actions secrets:\n' >&2
            printf '  - %s\n' "${missing[@]}" >&2
            echo "Configure them in Settings -> Secrets and variables -> Actions." >&2
            echo "Signing secrets are required even when notarization is disabled because the app and DMG are always codesigned." >&2
            exit 1
          fi

          echo "MISTY_NOTARIZE=$notarize" >> "$GITHUB_ENV"
          echo "MACOS_KEYCHAIN_PASSWORD=$MACOS_DEVELOPER_ID_CERT_PASSWORD" >> "$GITHUB_ENV"

      - name: Install macOS release dependencies
        run: |
          brew install create-dmg dylibbundler grpc protobuf openssl@3 ninja

      - name: Configure client build
        run: |
          cmake -S client -B client/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$(brew --prefix grpc);$(brew --prefix protobuf);$(brew --prefix openssl@3)"

      - name: Import Developer ID certificate
        env:
          MACOS_DEVELOPER_ID: ${{ secrets.MACOS_DEVELOPER_ID }}
          MACOS_DEVELOPER_ID_CERT_P12: ${{ secrets.MACOS_DEVELOPER_ID_CERT_P12 }}
          MACOS_CERTIFICATE_PATH: ${{ runner.temp }}/misty-developer-id.p12
          MACOS_KEYCHAIN_PATH: ${{ runner.temp }}/misty-signing.keychain-db
        run: |
          if [[ -z "${MACOS_DEVELOPER_ID_CERT_P12:-}" ]]; then
            echo "error: MACOS_DEVELOPER_ID_CERT_P12 is not configured" >&2
            exit 1
          fi
          echo "$MACOS_DEVELOPER_ID_CERT_P12" | base64 -D > "$MACOS_CERTIFICATE_PATH"
          security create-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$MACOS_KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$MACOS_KEYCHAIN_PATH"
          security unlock-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$MACOS_KEYCHAIN_PATH"
          security import "$MACOS_CERTIFICATE_PATH" \
            -P "$MACOS_KEYCHAIN_PASSWORD" \
            -A \
            -f pkcs12 \
            -k "$MACOS_KEYCHAIN_PATH"
          security list-keychains -d user -s "$MACOS_KEYCHAIN_PATH" login.keychain-db
          security default-keychain -d user -s "$MACOS_KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$MACOS_KEYCHAIN_PASSWORD" "$MACOS_KEYCHAIN_PATH"
          if ! security find-identity -v -p codesigning "$MACOS_KEYCHAIN_PATH" | grep -qF "$MACOS_DEVELOPER_ID"; then
            echo "error: imported keychain does not contain signing identity:" >&2
            echo "  $MACOS_DEVELOPER_ID" >&2
            echo "Check that MACOS_DEVELOPER_ID_CERT_P12 is a base64-encoded Developer ID .p12 containing the private key." >&2
            exit 1
          fi
          echo "MACOS_KEYCHAIN_PATH=$MACOS_KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Write signing configuration
        env:
          MACOS_DEVELOPER_ID: ${{ secrets.MACOS_DEVELOPER_ID }}
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_APP_PASSWORD: ${{ secrets.MACOS_NOTARY_APP_PASSWORD }}
          MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
        run: |
          cat > releases/macos/.env <<EOF
          MACOS_DEVELOPER_ID="${MACOS_DEVELOPER_ID}"
          MACOS_NOTARY_APPLE_ID="${MACOS_NOTARY_APPLE_ID}"
          MACOS_NOTARY_TEAM_ID="${MACOS_NOTARY_TEAM_ID}"
          MACOS_NOTARY_APP_PASSWORD="${MACOS_NOTARY_APP_PASSWORD}"
          EOF

      - name: Run macOS DMG pipeline
        run: |
          # GitHub-hosted macOS runners do not provide a reliable interactive
          # Aqua session for launching the GUI smoke test with `open`.
          args=(--skip-test)
          if [[ "${MISTY_NOTARIZE}" != "true" ]]; then
            args+=(--skip-notarize)
          fi
          ./releases/macos/publish_dmg.sh "${args[@]}"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: misty-macos-dmg
          path: releases/Misty-*.dmg
          if-no-files-found: error

      - name: Publish GitHub release asset
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: releases/Misty-*.dmg
          generate_release_notes: true
