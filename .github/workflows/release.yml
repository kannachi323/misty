name: Signed desktop beta release

on:
  push:
    tags:
      - "misty-v*"

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    name: Release quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Scan current release source
        run: >-
          docker run --rm -v "$PWD:/repo"
          zricethezav/gitleaks@sha256:e1b35e12a8c6fa8901f060459cfb6b2fc4c484d3afbe3b029733a3bbfab07055
          detect --source=/repo --no-git --redact --config=/repo/.gitleaks.toml
      - run: npm ci
      - name: Verify tag and application versions
        run: npm run release:verify-version
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
      - run: npm run check
      - run: npm run build:desktop
      - run: npm run report:bundle-size
      - run: npm run audit:production
      - run: npm run release:metadata

  publish:
    name: Signed ${{ matrix.name }}
    needs: gate
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            platform: macos-14
            args: "--target aarch64-apple-darwin --bundles app,dmg"
          - name: macOS Intel
            platform: macos-15-intel
            args: "--target x86_64-apple-darwin --bundles app,dmg"
          - name: Windows x64
            platform: windows-latest
            args: "--bundles nsis"
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Verify tag and application versions
        run: npm run release:verify-version
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
      - name: Import Windows Authenticode certificate
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE -or -not $env:WINDOWS_CERTIFICATE_PASSWORD) {
            throw "Windows signing secrets are required."
          }
          $certificatePath = Join-Path $env:RUNNER_TEMP "misty-signing.pfx"
          [IO.File]::WriteAllBytes(
            $certificatePath,
            [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE)
          )
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate `
            -FilePath $certificatePath `
            -CertStoreLocation Cert:\CurrentUser\My `
            -Password $password
          Remove-Item $certificatePath -Force
          "WINDOWS_CERTIFICATE_THUMBPRINT=$($certificate.Thumbprint)" >> $env:GITHUB_ENV
      - name: Prepare signed release configuration
        run: npm run release:config
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
          TAURI_UPDATER_ENDPOINT: ${{ vars.TAURI_UPDATER_ENDPOINT }}
          TAURI_CSP_CONNECT_SOURCES: ${{ vars.TAURI_CSP_CONNECT_SOURCES }}
          TAURI_CSP_IMAGE_SOURCES: ${{ vars.TAURI_CSP_IMAGE_SOURCES }}
          WINDOWS_CERTIFICATE_THUMBPRINT: ${{ env.WINDOWS_CERTIFICATE_THUMBPRINT }}
          WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
          VITE_PRIVACY_POLICY_URL: ${{ vars.VITE_PRIVACY_POLICY_URL }}
          VITE_TERMS_URL: ${{ vars.VITE_TERMS_URL }}
          VITE_DESKTOP_LICENSE_URL: ${{ vars.VITE_DESKTOP_LICENSE_URL }}
          VITE_SUPPORT_URL: ${{ vars.VITE_SUPPORT_URL }}
          VITE_SECURITY_URL: ${{ vars.VITE_SECURITY_URL }}
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: misty-v__VERSION__
          releaseName: "Misty __VERSION__ beta"
          releaseBody: "Signed public-beta desktop build. Review generated release notes before publishing."
          releaseDraft: true
          prerelease: true
          generateReleaseNotes: true
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          uploadUpdaterSignatures: true
          args: "${{ matrix.args }} --config artifacts/release/tauri.release.conf.json"
