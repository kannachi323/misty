name: Release Extension Bundles

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run validate
      - run: npm run build
      - name: Create install bundles
        run: |
          mkdir artifacts
          (cd dist/plugins && zip -qr ../../artifacts/quick_convert.zip quick_convert)
          (cd dist/plugins && zip -qr ../../artifacts/themes.zip themes)
          (cd dist/plugins && zip -qr ../../artifacts/ytdlp.zip ytdlp)
      - name: Publish bundles
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --generate-notes
          gh release upload "${GITHUB_REF_NAME}" artifacts/*.zip --clobber
