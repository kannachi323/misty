name: Desktop beta release

on:
  push:
    tags:
      - "misty-v*"

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    name: Release quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Scan current release source
        run: >-
          docker run --rm -v "$PWD:/repo"
          zricethezav/gitleaks@sha256:e1b35e12a8c6fa8901f060459cfb6b2fc4c484d3afbe3b029733a3bbfab07055
          detect --source=/repo --no-git --redact --config=/repo/.gitleaks.toml
      - run: npm ci
      - name: Verify tag and application versions
        run: npm run release:verify-version
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
      - run: npm run check
      - run: npm run build:desktop
      - run: npm run report:bundle-size
      - run: npm run audit:production
      - run: npm run release:metadata

  publish:
    name: Release ${{ matrix.name }}
    needs: gate
    environment: production
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            platform: macos-14
            args: "--target aarch64-apple-darwin --bundles app,dmg"
          - name: macOS Intel
            platform: macos-15-intel
            args: "--target x86_64-apple-darwin --bundles app,dmg"
          - name: Windows x64 (unsigned beta)
            platform: windows-latest
            args: "--target x86_64-pc-windows-msvc --bundles nsis"
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 90
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      MISTY_PUBLIC_API_URL: ${{ vars.MISTY_PUBLIC_API_URL }}
      VITE_APP_ENVIRONMENT: ${{ vars.VITE_APP_ENVIRONMENT }}
      VITE_DISTRIBUTION_CHANNEL: ${{ vars.VITE_DISTRIBUTION_CHANNEL }}
      VITE_RELEASE_CHANNEL: ${{ vars.VITE_RELEASE_CHANNEL }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Verify tag and application versions
        run: npm run release:verify-version
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
      - name: Prepare release configuration
        run: npm run release:config
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
          TAURI_UPDATER_ENDPOINT: ${{ vars.TAURI_UPDATER_ENDPOINT }}
          TAURI_CSP_CONNECT_SOURCES: ${{ vars.TAURI_CSP_CONNECT_SOURCES }}
          TAURI_CSP_IMAGE_SOURCES: ${{ vars.TAURI_CSP_IMAGE_SOURCES }}
      - name: Require Apple signing and notarization credentials
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in \
            APPLE_CERTIFICATE \
            APPLE_CERTIFICATE_PASSWORD \
            APPLE_SIGNING_IDENTITY \
            APPLE_ID \
            APPLE_PASSWORD \
            APPLE_TEAM_ID
          do
            if [[ -z "${!name}" ]]; then
              echo "::error::$name is required for a signed and notarized macOS release."
              exit 1
            fi
          done
      - uses: tauri-apps/tauri-action@v1
        id: build
        env:
          GITHUB_TOKEN: ${{ secrets.MISTY_RELEASE_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          owner: misty-org
          repo: misty-public
          releaseCommitish: main
          tagName: misty-v__VERSION__
          releaseName: "Misty __VERSION__ beta"
          releaseBody: "Public-beta desktop build. macOS artifacts are Developer ID signed and notarized; the Windows installer is currently unsigned. Add customer-facing release notes before publishing."
          releaseDraft: true
          prerelease: true
          generateReleaseNotes: false
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          args: "${{ matrix.args }} --config artifacts/release/tauri.release.conf.json"
      - name: Verify macOS signature and notarization ticket
        if: runner.os == 'macOS'
        shell: bash
        run: |
          app_path="$(find src-tauri/target -type d -path '*/release/bundle/macos/*.app' -print -quit)"
          dmg_path="$(find src-tauri/target -type f -path '*/release/bundle/dmg/*.dmg' -print -quit)"

          if [[ -z "$app_path" || -z "$dmg_path" ]]; then
            echo "::error::Expected signed macOS app and DMG artifacts were not found."
            exit 1
          fi

          codesign --verify --deep --strict --verbose=2 "$app_path"
          spctl --assess --type execute --verbose=4 "$app_path"
          xcrun stapler validate "$dmg_path"
      - name: Verify Windows installer was produced
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path src-tauri/target -Recurse -File -Filter *.exe |
            Where-Object { $_.FullName -match '[\\/]bundle[\\/]nsis[\\/]' } |
            Select-Object -First 1

          if (-not $installer) {
            throw "No Windows NSIS installer was produced."
          }

          $signature = Get-AuthenticodeSignature -FilePath $installer.FullName
          Write-Host "Windows installer: $($installer.FullName)"
          Write-Host "Authenticode status: $($signature.Status)"
