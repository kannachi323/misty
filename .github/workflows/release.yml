name: Signed desktop beta release

on:
  push:
    tags:
      - "misty-v*"

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    name: Release quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Scan current release source
        run: >-
          docker run --rm -v "$PWD:/repo"
          zricethezav/gitleaks@sha256:e1b35e12a8c6fa8901f060459cfb6b2fc4c484d3afbe3b029733a3bbfab07055
          detect --source=/repo --no-git --redact --config=/repo/.gitleaks.toml
      - run: npm ci
      - name: Verify tag and application versions
        run: npm run release:verify-version
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
      - run: npm run check
      - run: npm run build:desktop
      - run: npm run report:bundle-size
      - run: npm run audit:production
      - run: npm run release:metadata

  publish:
    name: Signed ${{ matrix.name }}
    needs: gate
    environment: production
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            platform: macos-14
            args: "--target aarch64-apple-darwin --bundles app,dmg"
          - name: macOS Intel
            platform: macos-15-intel
            args: "--target x86_64-apple-darwin --bundles app,dmg"
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 90
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      MISTY_PUBLIC_API_URL: ${{ vars.MISTY_PUBLIC_API_URL }}
      VITE_APP_ENVIRONMENT: ${{ vars.VITE_APP_ENVIRONMENT }}
      VITE_DISTRIBUTION_CHANNEL: ${{ vars.VITE_DISTRIBUTION_CHANNEL }}
      VITE_RELEASE_CHANNEL: ${{ vars.VITE_RELEASE_CHANNEL }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Verify tag and application versions
        run: npm run release:verify-version
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
      - name: Prepare signed release configuration
        run: npm run release:config
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
          TAURI_UPDATER_ENDPOINT: ${{ vars.TAURI_UPDATER_ENDPOINT }}
          TAURI_CSP_CONNECT_SOURCES: ${{ vars.TAURI_CSP_CONNECT_SOURCES }}
          TAURI_CSP_IMAGE_SOURCES: ${{ vars.TAURI_CSP_IMAGE_SOURCES }}
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.MISTY_RELEASE_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          owner: misty-org
          repo: misty-public
          releaseCommitish: main
          tagName: misty-v__VERSION__
          releaseName: "Misty __VERSION__ beta"
          releaseBody: "Signed public-beta desktop build. Add customer-facing release notes before publishing."
          releaseDraft: true
          prerelease: false
          generateReleaseNotes: false
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          args: "${{ matrix.args }} --config artifacts/release/tauri.release.conf.json"
