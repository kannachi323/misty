name: Controlled database migration

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        type: choice
        required: true
        options:
          - staging
          - production
      backup_reference:
        description: Provider backup or PITR restore-point reference
        type: string
        required: true
      compatibility_approved:
        description: Confirm old/new API compatibility was reviewed
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: database-migration-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  migrate:
    name: Migrate ${{ inputs.environment }}
    if: github.ref == 'refs/heads/main' && inputs.compatibility_approved
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Require a recorded backup
        env:
          BACKUP_REFERENCE: ${{ inputs.backup_reference }}
        run: |
          test -n "${BACKUP_REFERENCE// }"
          echo "Using the approved backup/PITR reference recorded in this deployment."
      - name: Install pinned migration tool
        run: go install github.com/pressly/goose/v3/cmd/goose@v3.27.3
      - name: Inspect current migration state
        run: ./scripts/goose.sh status
        env: &database
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_MIGRATION_USER: ${{ secrets.DB_MIGRATION_USER }}
          DB_MIGRATION_PASSWORD: ${{ secrets.DB_MIGRATION_PASSWORD }}
          DB_SSLMODE: ${{ vars.DB_SSLMODE }}
      - name: Apply forward migrations
        run: ./scripts/goose.sh up
        env: *database
      - name: Verify migration state
        run: |
          ./scripts/goose.sh status
          ./scripts/goose.sh version
        env: *database
