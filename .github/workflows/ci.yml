name: CI

on:
  workflow_call:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Security checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Scan current release source
        run: >-
          docker run --rm -v "$PWD:/repo"
          zricethezav/gitleaks@sha256:e1b35e12a8c6fa8901f060459cfb6b2fc4c484d3afbe3b029733a3bbfab07055
          detect --source=/repo --no-git --redact --config=/repo/.gitleaks.toml

  backend:
    name: API and database checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg17
        env:
          POSTGRES_USER: misty
          POSTGRES_PASSWORD: misty-test-password
          POSTGRES_DB: misty_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U misty -d misty_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_USER: misty
      DB_PASSWORD: misty-test-password
      DB_NAME: misty_test
      DB_SSLMODE: disable
      TEST_DB_HOST: 127.0.0.1
      TEST_DB_PORT: "5432"
      TEST_DB_USER: misty
      TEST_DB_PASSWORD: misty-test-password
      TEST_DB_NAME: misty_test
      TEST_DB_SSLMODE: disable
      STRIPE_WEBHOOK_SECRET: whsec_ci_test_secret_123
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: 1.25.12
          cache: true
      - name: Check Go formatting
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "$files"
            exit 1
          fi
      - run: go vet ./...
      - name: Install pinned migration tool
        run: go install github.com/pressly/goose/v3/cmd/goose@v3.27.3
      - name: Apply database migrations
        run: ./scripts/goose.sh up
      - name: Test backend and database integration
        # Database packages share one destructive test database. Keep package
        # execution serial so one package cannot reset another package's data.
        run: go test -p 1 ./... -count=1

  journal-worker:
    name: Collaboration Worker checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: cloudflare/journal-collab
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: cloudflare/journal-collab/.nvmrc
          cache: npm
          cache-dependency-path: cloudflare/journal-collab/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Validate deploy bundle
        run: npm run test:runtime
