    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Misty" />
    <meta
      property="og:title"
      content="Misty — Organize, create, and collaborate"
    />
    <meta
      property="og:description"
      content="Misty is a fast, lightweight workspace with built-in apps for organizing, creating, and collaborating."

    />
    <meta name="twitter:image" content="https://mistysys.com/og.png" />
    <script>
      (() => {
        try {
          const storedTheme = localStorage.getItem("misty-ui-theme");
          const theme = storedTheme === "light" ? "light" : "dark";
          document.documentElement.classList.add(theme);
          document.documentElement.style.colorScheme = theme;
          document.querySelector('link[rel="icon"]').href =
            theme === "light" ? "/misty-black.png" : "/misty-white.png";
        } catch {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
