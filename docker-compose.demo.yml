services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: misty-demo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: misty_demo
      POSTGRES_PASSWORD: misty-demo-local-only
      POSTGRES_DB: misty_demo
    ports:
      - "5436:5432"
    volumes:
      - misty_demo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U misty_demo -d misty_demo"]
      interval: 2s
      timeout: 3s
      retries: 15

  server:
    build:
      context: .
      dockerfile: Dockerfile.demo
    container_name: misty-demo-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: "8081"
      MISTY_ENVIRONMENT: development
      MISTY_RELEASE_CHANNEL: demo
      MISTY_DEMO_MODE: local
      MISTY_DEMO_ADMIN_TOKEN: ${MISTY_DEMO_ADMIN_TOKEN:?MISTY_DEMO_ADMIN_TOKEN is required}
      MISTY_LIBRARY_LOCAL_DIR: /var/lib/misty-demo/library
      MISTY_AGENT_DOCUMENTS_ENABLED: "false"
      MISTY_DEVICE_JOBS_ENABLED: "false"
      MISTY_FOLDER_AGENTS_ENABLED: "false"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: misty_demo
      DB_PASSWORD: misty-demo-local-only
      DB_NAME: misty_demo
      PASSWORD_RESET_START_URL: http://localhost:8081/auth/reset/start
      PASSWORD_RESET_URL: http://localhost:5173/reset
      AI_GATEWAY_API_KEY: ""
    ports:
      - "${MISTY_DEMO_SERVER_PORT:-8081}:8081"
    volumes:
      - misty_demo_library:/var/lib/misty-demo/library
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent -H 'Authorization: Bearer '$$MISTY_DEMO_ADMIN_TOKEN http://127.0.0.1:8081/api/internal/demo/status >/dev/null"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  misty_demo_pgdata:
  misty_demo_library:
