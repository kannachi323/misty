version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - errcheck      # unchecked errors
    - govet         # suspicious constructs
    - ineffassign   # assignments never used
    - staticcheck   # correctness, simplification, style (includes gosimple + stylecheck)
    - unused        # unused identifiers
    - revive        # golint successor — naming and package conventions
    - bodyclose     # unclosed HTTP response bodies
    - rowserrcheck  # unchecked sql.Rows.Err
    - sqlclosecheck # unclosed sql.Rows / sql.Stmt

  settings:
    revive:
      rules:
        # Package naming is the rule this repo cares most about — see CLAUDE.md.
        # Directory name and package name must agree.
        - name: package-comments
          disabled: true
        - name: var-naming
        - name: indent-error-flow
        - name: errorf
        - name: context-as-argument
        - name: context-keys-type
        - name: unexported-return
        - name: blank-imports
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: increment-decrement
        - name: error-return
        - name: error-naming
        - name: error-strings

    staticcheck:
      checks:
        - all
        # ST1000 demands a comment on every package; doc.go files cover the ones
        # that matter and the rest would be noise.
        - -ST1000

  exclusions:
    generated: lax
    rules:
      # Table-driven tests legitimately shadow and ignore more.
      - path: _test\.go
        linters:
          - errcheck
          - bodyclose

formatters:
  enable:
    - gofmt
  settings:
    gofmt:
      simplify: true

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
