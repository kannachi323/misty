name: misty-self-hosted

x-api-image: &api-image
  image: ${MISTY_API_IMAGE:?Set an immutable Misty API image such as ghcr.io/misty/api@sha256:...}

x-activepieces-environment: &activepieces-environment
  AP_EDITION: ce
  AP_ENVIRONMENT: prod
  AP_FRONTEND_URL: ${ACTIVEPIECES_PUBLIC_URL:?Set ACTIVEPIECES_PUBLIC_URL}
  AP_ENCRYPTION_KEY: ${ACTIVEPIECES_ENCRYPTION_KEY:?Set ACTIVEPIECES_ENCRYPTION_KEY}
  AP_JWT_SECRET: ${ACTIVEPIECES_JWT_SECRET:?Set ACTIVEPIECES_JWT_SECRET}
  AP_DB_TYPE: POSTGRES
  AP_POSTGRES_HOST: activepieces-postgres
  AP_POSTGRES_PORT: "5432"
  AP_POSTGRES_DATABASE: ${ACTIVEPIECES_POSTGRES_DATABASE:-activepieces}
  AP_POSTGRES_USERNAME: ${ACTIVEPIECES_POSTGRES_USERNAME:-activepieces}
  AP_POSTGRES_PASSWORD: ${ACTIVEPIECES_POSTGRES_PASSWORD:?Set ACTIVEPIECES_POSTGRES_PASSWORD}
  AP_REDIS_TYPE: STANDALONE
  AP_REDIS_HOST: activepieces-redis
  AP_REDIS_PORT: "6379"
  AP_REDIS_USER: default
  AP_REDIS_PASSWORD: ${ACTIVEPIECES_REDIS_PASSWORD:?Set ACTIVEPIECES_REDIS_PASSWORD}
  AP_EXECUTION_MODE: SANDBOX_CODE_ONLY
  AP_WORKER_CONCURRENCY: "1"
  AP_FILE_STORAGE_LOCATION: DB
  AP_QUEUE_UI_ENABLED: "false"
  AP_TELEMETRY_ENABLED: "false"
  AP_TOOL_SEARCH_ENABLED: "false"

services:
  postgres:
    image: pgvector/pgvector:pg16@sha256:1d533553fefe4f12e5d80c7b80622ba0c382abb5758856f52983d8789179f0fb
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_MIGRATION_USER:?Set DB_MIGRATION_USER}
      POSTGRES_PASSWORD: ${DB_MIGRATION_PASSWORD:?Set DB_MIGRATION_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-misty}
      MISTY_APP_DB_USER: ${DB_USER:-misty_app}
      MISTY_APP_DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../scripts/docker/postgres-init-app-role.sh:/docker-entrypoint-initdb.d/10-misty-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [database]

  activepieces-postgres:
    image: pgvector/pgvector:0.8.0-pg14@sha256:c55d7e7deac05dde62139e0ded4fcf4f58363656cbc382dbea82fbed995aa767
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${ACTIVEPIECES_POSTGRES_DATABASE:-activepieces}
      POSTGRES_USER: ${ACTIVEPIECES_POSTGRES_USERNAME:-activepieces}
      POSTGRES_PASSWORD: ${ACTIVEPIECES_POSTGRES_PASSWORD:?Set ACTIVEPIECES_POSTGRES_PASSWORD}
    volumes:
      - activepieces_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [activepieces-database]

  activepieces-redis:
    image: redis:7.0.7@sha256:bb474c35022ca2c5618f4c49ca759bd2c0eea1daf5d934c560bd30092b97b498
    restart: unless-stopped
    environment:
      ACTIVEPIECES_REDIS_PASSWORD: ${ACTIVEPIECES_REDIS_PASSWORD:?Set ACTIVEPIECES_REDIS_PASSWORD}
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${ACTIVEPIECES_REDIS_PASSWORD:?Set ACTIVEPIECES_REDIS_PASSWORD}"]
    volumes:
      - activepieces_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$ACTIVEPIECES_REDIS_PASSWORD ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [activepieces-database]

  activepieces-app:
    image: ghcr.io/activepieces/activepieces:0.88.3@sha256:3080dd4c59b5e969589562c1f7d5913b71184790586d0c43b8ea6f8b723b2ddb
    restart: unless-stopped
    environment:
      <<: *activepieces-environment
      AP_CONTAINER_TYPE: APP
    volumes:
      - activepieces_cache:/usr/src/app/cache
    ports:
      - "127.0.0.1:${ACTIVEPIECES_HOST_PORT:-8090}:80"
    depends_on:
      activepieces-postgres:
        condition: service_healthy
      activepieces-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:80/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 30
    networks: [edge, activepieces-database]

  activepieces-worker:
    image: ghcr.io/activepieces/activepieces:0.88.3@sha256:3080dd4c59b5e969589562c1f7d5913b71184790586d0c43b8ea6f8b723b2ddb
    restart: unless-stopped
    environment:
      AP_CONTAINER_TYPE: WORKER
      AP_FRONTEND_URL: http://activepieces-app:80
      AP_JWT_SECRET: ${ACTIVEPIECES_JWT_SECRET:?Set ACTIVEPIECES_JWT_SECRET}
      AP_WORKER_CONCURRENCY: "1"
      AP_REUSE_SANDBOX: "true"
      AP_EXECUTION_MODE: SANDBOX_CODE_ONLY
      AP_TELEMETRY_ENABLED: "false"
    volumes:
      - activepieces_cache:/usr/src/app/cache
    depends_on:
      activepieces-app:
        condition: service_healthy
    networks: [edge]

  agent-runtime-postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: workflow
      POSTGRES_PASSWORD: ${AGENT_RUNTIME_DB_PASSWORD:?Set AGENT_RUNTIME_DB_PASSWORD}
      POSTGRES_DB: workflow
    volumes:
      - agent_runtime_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workflow -d workflow"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [agent-runtime-database]

  agent-runtime-setup:
    image: ${MISTY_AGENT_RUNTIME_IMAGE:?Set an immutable Misty Agent runtime image}
    restart: "no"
    environment:
      WORKFLOW_TARGET_WORLD: "@workflow/world-postgres"
      WORKFLOW_POSTGRES_URL: postgres://workflow:${AGENT_RUNTIME_DB_PASSWORD:?Set AGENT_RUNTIME_DB_PASSWORD}@agent-runtime-postgres:5432/workflow
    depends_on:
      agent-runtime-postgres:
        condition: service_healthy
    command: ["node", "node_modules/@workflow/world-postgres/bin/setup.js"]
    networks: [agent-runtime-database]

  agent-runtime:
    image: ${MISTY_AGENT_RUNTIME_IMAGE:?Set an immutable Misty Agent runtime image}
    restart: unless-stopped
    environment:
      PORT: "3000"
      WORKFLOW_TARGET_WORLD: "@workflow/world-postgres"
      WORKFLOW_POSTGRES_URL: postgres://workflow:${AGENT_RUNTIME_DB_PASSWORD:?Set AGENT_RUNTIME_DB_PASSWORD}@agent-runtime-postgres:5432/workflow
      MISTY_INTERNAL_API_BASE: http://api:8080
      MISTY_AGENT_RUNTIME_CONTROL_SECRET: ${MISTY_AGENT_RUNTIME_CONTROL_SECRET:?Set MISTY_AGENT_RUNTIME_CONTROL_SECRET}
      MISTY_AGENT_RUNTIME_CONTROL_SECRET_PREVIOUS: ${MISTY_AGENT_RUNTIME_CONTROL_SECRET_PREVIOUS:-}
      AI_GATEWAY_API_KEY: ${AI_GATEWAY_API_KEY:?Set AI_GATEWAY_API_KEY}
    depends_on:
      agent-runtime-setup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3000/health >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [edge, agent-runtime-database]

  migrate:
    <<: *api-image
    restart: "no"
    environment:
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: >-
        host=postgres port=5432 user=${DB_MIGRATION_USER:?Set DB_MIGRATION_USER}
        password=${DB_MIGRATION_PASSWORD:?Set DB_MIGRATION_PASSWORD}
        dbname=${DB_NAME:-misty} sslmode=disable
      GOOSE_MIGRATION_DIR: /app/migrations
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/usr/local/bin/goose"]
    command: ["up"]
    networks: [database]

  database-permissions:
    image: pgvector/pgvector:pg16@sha256:1d533553fefe4f12e5d80c7b80622ba0c382abb5758856f52983d8789179f0fb
    restart: "no"
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${DB_NAME:-misty}
      PGUSER: ${DB_MIGRATION_USER:?Set DB_MIGRATION_USER}
      PGPASSWORD: ${DB_MIGRATION_PASSWORD:?Set DB_MIGRATION_PASSWORD}
      MISTY_APP_DB_USER: ${DB_USER:-misty_app}
      MISTY_APP_DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes:
      - ../scripts/docker/postgres-grant-app-role.sh:/usr/local/bin/misty-grant-app-role:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    entrypoint: ["/bin/sh", "/usr/local/bin/misty-grant-app-role"]
    networks: [database]

  api:
    <<: *api-image
    restart: unless-stopped
    env_file: ${MISTY_ENV_FILE:-.env}
    environment:
      MISTY_DEPLOYMENT_MODE: self_hosted
      MISTY_ENVIRONMENT: production
      PORT: "8080"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-misty}
      DB_USER: ${DB_USER:-misty_app}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      MISTY_LIBRARY_FILESYSTEM_DIR: /var/lib/misty/library
      MISTY_COLLAB_INTERNAL_SECRET: ${MISTY_COLLAB_INTERNAL_SECRET:?Set MISTY_COLLAB_INTERNAL_SECRET}
      MISTY_AGENT_RUNTIME_URL: http://agent-runtime:3000
      MISTY_AGENT_RUNTIME_INTERNAL_API_URL: http://api:8080
      MISTY_AGENT_RUNTIME_CONTROL_SECRET: ${MISTY_AGENT_RUNTIME_CONTROL_SECRET:?Set MISTY_AGENT_RUNTIME_CONTROL_SECRET}
      MISTY_AGENT_RUNTIME_CONTROL_SECRET_PREVIOUS: ${MISTY_AGENT_RUNTIME_CONTROL_SECRET_PREVIOUS:-}
      MISTY_ACTIVEPIECES_MCP_URL: "${ACTIVEPIECES_PUBLIC_URL:?Set ACTIVEPIECES_PUBLIC_URL}/mcp"
      MISTY_ACTIVEPIECES_PROXY_URL: http://activepieces-app:80
      MISTY_ACTIVEPIECES_BOOTSTRAP_SECRET: "${ACTIVEPIECES_JWT_SECRET:?Set ACTIVEPIECES_JWT_SECRET}"
    volumes:
      - library_data:/var/lib/misty/library
    ports:
      - "127.0.0.1:${MISTY_API_PORT:-8080}:8080"
    depends_on:
      database-permissions:
        condition: service_completed_successfully
        restart: true
      agent-runtime:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8080/health >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [edge, database]

  collaboration:
    image: ${MISTY_COLLAB_IMAGE:?Set an immutable Misty collaboration image such as ghcr.io/misty/collab@sha256:...}
    restart: unless-stopped
    environment:
      PORT: "1999"
      MISTY_INTERNAL_API_BASE: http://api:8080
      MISTY_COLLAB_INTERNAL_SECRET: ${MISTY_COLLAB_INTERNAL_SECRET:?Set MISTY_COLLAB_INTERNAL_SECRET}
      JOURNAL_COLLAB_TICKET_PUBLIC_KEY: ${JOURNAL_COLLAB_TICKET_PUBLIC_KEY:?Set JOURNAL_COLLAB_TICKET_PUBLIC_KEY}
      JOURNAL_COLLAB_CONTROL_SECRET: ${JOURNAL_COLLAB_CONTROL_SECRET:?Set JOURNAL_COLLAB_CONTROL_SECRET}
      JOURNAL_COLLAB_ROOM_SALT: ${JOURNAL_COLLAB_ROOM_SALT:?Set JOURNAL_COLLAB_ROOM_SALT}
    ports:
      - "127.0.0.1:${MISTY_COLLAB_PORT:-1999}:1999"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:1999/health >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [edge]

volumes:
  postgres_data:
  agent_runtime_postgres_data:
  library_data:
  activepieces_postgres_data:
  activepieces_redis_data:
  activepieces_cache:

networks:
  edge:
  database:
    internal: true
  agent-runtime-database:
    internal: true
  activepieces-database:
    internal: true
