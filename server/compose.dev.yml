name: misty-server

x-api-image: &api-image
  image: ${MISTY_API_IMAGE:-misty-server:local}
  build:
    context: .
    dockerfile: Dockerfile

x-activepieces-environment: &activepieces-environment
  AP_EDITION: ce
  AP_ENVIRONMENT: prod
  AP_FRONTEND_URL: ${ACTIVEPIECES_PUBLIC_URL:-https://dev-api.mistysys.com/activepieces}
  AP_ENCRYPTION_KEY: ${ACTIVEPIECES_ENCRYPTION_KEY:?set ACTIVEPIECES_ENCRYPTION_KEY}
  AP_JWT_SECRET: ${ACTIVEPIECES_JWT_SECRET:?set ACTIVEPIECES_JWT_SECRET}
  AP_DB_TYPE: POSTGRES
  AP_POSTGRES_HOST: activepieces-postgres
  AP_POSTGRES_PORT: "5432"
  AP_POSTGRES_DATABASE: ${ACTIVEPIECES_POSTGRES_DATABASE:-activepieces}
  AP_POSTGRES_USERNAME: ${ACTIVEPIECES_POSTGRES_USERNAME:-activepieces}
  AP_POSTGRES_PASSWORD: ${ACTIVEPIECES_POSTGRES_PASSWORD:?set ACTIVEPIECES_POSTGRES_PASSWORD}
  AP_REDIS_TYPE: STANDALONE
  AP_REDIS_HOST: activepieces-redis
  AP_REDIS_PORT: "6379"
  AP_REDIS_USER: default
  AP_REDIS_PASSWORD: ${ACTIVEPIECES_REDIS_PASSWORD:?set ACTIVEPIECES_REDIS_PASSWORD}
  AP_EXECUTION_MODE: SANDBOX_CODE_ONLY
  AP_WORKER_CONCURRENCY: "1"
  AP_FILE_STORAGE_LOCATION: DB
  AP_QUEUE_UI_ENABLED: "false"
  AP_TELEMETRY_ENABLED: "false"
  AP_TOOL_SEARCH_ENABLED: "false"

x-cloudflare-image: &cloudflare-image
  image: misty-journal-collab-dev:local
  build:
    context: cloudflare/journal-collab
    dockerfile_inline: |
      FROM node:24-alpine@sha256:a0b9bf06e4e6193cf7a0f58816cc935ff8c2a908f81e6f1a95432d679c54fbfd

      WORKDIR /app

      COPY package.json package-lock.json ./
      RUN npm ci

      COPY tsconfig.json vitest.config.ts wrangler.jsonc ./
      COPY src ./src
      COPY test ./test
      COPY --chmod=0555 docker/cloudflare-init.sh /usr/local/bin/misty-cloudflare-init
      COPY --chmod=0555 docker/cloudflare-deploy.sh /usr/local/bin/misty-cloudflare-deploy

      CMD ["npm", "run", "build"]

services:
  dev-init:
    <<: *cloudflare-image
    restart: "no"
    entrypoint: ["/bin/sh", "/usr/local/bin/misty-cloudflare-init"]
    volumes:
      - ./cloudflare/journal-collab:/workspace
      - dev_runtime:/run/misty
    networks: [edge]

  postgres:
    image: pgvector/pgvector:pg16@sha256:1d533553fefe4f12e5d80c7b80622ba0c382abb5758856f52983d8789179f0fb
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_MIGRATION_USER:-misty}
      POSTGRES_PASSWORD: ${DB_MIGRATION_PASSWORD:-misty}
      POSTGRES_DB: ${DB_NAME:-misty_server}
      MISTY_APP_DB_USER: ${DB_USER:-misty_app}
      MISTY_APP_DB_PASSWORD: ${DB_PASSWORD:-misty}
    ports:
      - "127.0.0.1:${DB_PORT:-5435}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/docker/postgres-init-app-role.sh:/docker-entrypoint-initdb.d/10-misty-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 5s
      retries: 20
    networks: [database, edge]

  activepieces-postgres:
    image: pgvector/pgvector:0.8.0-pg14@sha256:c55d7e7deac05dde62139e0ded4fcf4f58363656cbc382dbea82fbed995aa767
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${ACTIVEPIECES_POSTGRES_DATABASE:-activepieces}
      POSTGRES_USER: ${ACTIVEPIECES_POSTGRES_USERNAME:-activepieces}
      POSTGRES_PASSWORD: ${ACTIVEPIECES_POSTGRES_PASSWORD:?set ACTIVEPIECES_POSTGRES_PASSWORD}
    volumes:
      - activepieces_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [activepieces-database]

  activepieces-redis:
    image: redis:7.0.7@sha256:bb474c35022ca2c5618f4c49ca759bd2c0eea1daf5d934c560bd30092b97b498
    restart: unless-stopped
    environment:
      ACTIVEPIECES_REDIS_PASSWORD: ${ACTIVEPIECES_REDIS_PASSWORD:?set ACTIVEPIECES_REDIS_PASSWORD}
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${ACTIVEPIECES_REDIS_PASSWORD:?set ACTIVEPIECES_REDIS_PASSWORD}"]
    volumes:
      - activepieces_redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$ACTIVEPIECES_REDIS_PASSWORD ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [activepieces-database]

  activepieces-app:
    image: ghcr.io/activepieces/activepieces:0.88.3@sha256:3080dd4c59b5e969589562c1f7d5913b71184790586d0c43b8ea6f8b723b2ddb
    restart: unless-stopped
    environment:
      <<: *activepieces-environment
      AP_CONTAINER_TYPE: APP
    volumes:
      - activepieces_cache:/usr/src/app/cache
    ports:
      - "127.0.0.1:${ACTIVEPIECES_HOST_PORT:-8090}:80"
    depends_on:
      activepieces-postgres:
        condition: service_healthy
      activepieces-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:80/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 30
    networks: [edge, activepieces-database]

  activepieces-worker:
    image: ghcr.io/activepieces/activepieces:0.88.3@sha256:3080dd4c59b5e969589562c1f7d5913b71184790586d0c43b8ea6f8b723b2ddb
    restart: unless-stopped
    environment:
      AP_CONTAINER_TYPE: WORKER
      AP_FRONTEND_URL: http://activepieces-app:80
      AP_JWT_SECRET: ${ACTIVEPIECES_JWT_SECRET:?set ACTIVEPIECES_JWT_SECRET}
      AP_WORKER_CONCURRENCY: "1"
      AP_REUSE_SANDBOX: "true"
      AP_EXECUTION_MODE: SANDBOX_CODE_ONLY
      AP_TELEMETRY_ENABLED: "false"
    volumes:
      - activepieces_cache:/usr/src/app/cache
    depends_on:
      activepieces-app:
        condition: service_healthy
    networks: [edge]

  agent-runtime-postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: workflow
      POSTGRES_PASSWORD: ${AGENT_RUNTIME_DB_PASSWORD:-workflow}
      POSTGRES_DB: workflow
    volumes:
      - agent_runtime_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workflow -d workflow"]
      interval: 3s
      timeout: 5s
      retries: 20
    networks: [agent-runtime-database]

  agent-runtime-setup:
    build:
      context: ..
      dockerfile: agent-runtime/Dockerfile
      target: setup
    restart: "no"
    environment:
      WORKFLOW_TARGET_WORLD: "@workflow/world-postgres"
      WORKFLOW_POSTGRES_URL: postgres://workflow:${AGENT_RUNTIME_DB_PASSWORD:-workflow}@agent-runtime-postgres:5432/workflow
    depends_on:
      agent-runtime-postgres:
        condition: service_healthy
    networks: [agent-runtime-database]

  agent-runtime:
    image: misty-agent-runtime-dev:local
    build:
      context: ..
      dockerfile: agent-runtime/Dockerfile
      target: runtime
    restart: unless-stopped
    environment:
      PORT: "3000"
      WORKFLOW_TARGET_WORLD: "@workflow/world-postgres"
      WORKFLOW_POSTGRES_URL: postgres://workflow:${AGENT_RUNTIME_DB_PASSWORD:-workflow}@agent-runtime-postgres:5432/workflow
      MISTY_INTERNAL_API_BASE: http://misty-api:8080
      MISTY_AGENT_RUNTIME_CONTROL_SECRET: ${MISTY_AGENT_RUNTIME_CONTROL_SECRET:-bWlzdHktYWdlbnQtcnVudGltZS1kZXYtc2VjcmV0ISE=}
      MISTY_AGENT_RUNTIME_CONTROL_SECRET_PREVIOUS: ${MISTY_AGENT_RUNTIME_CONTROL_SECRET_PREVIOUS:-}
      AI_GATEWAY_API_KEY: ${AI_GATEWAY_API_KEY:-}
    depends_on:
      agent-runtime-setup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3000/health >/dev/null"]
      interval: 3s
      timeout: 5s
      retries: 30
    networks: [edge, agent-runtime-database]

  migrate:
    <<: *api-image
    restart: "no"
    environment:
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: >-
        host=postgres port=5432
        user=${DB_MIGRATION_USER:-misty}
        password=${DB_MIGRATION_PASSWORD:-misty}
        dbname=${DB_NAME:-misty_server}
        sslmode=disable
      GOOSE_MIGRATION_DIR: /app/migrations
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/usr/local/bin/goose"]
    command: ["up"]
    networks: [database]

  database-permissions:
    image: pgvector/pgvector:pg16@sha256:1d533553fefe4f12e5d80c7b80622ba0c382abb5758856f52983d8789179f0fb
    restart: "no"
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${DB_NAME:-misty_server}
      PGUSER: ${DB_MIGRATION_USER:-misty}
      PGPASSWORD: ${DB_MIGRATION_PASSWORD:-misty}
      MISTY_APP_DB_USER: ${DB_USER:-misty_app}
      MISTY_APP_DB_PASSWORD: ${DB_PASSWORD:-misty}
    volumes:
      - ./scripts/docker/postgres-grant-app-role.sh:/usr/local/bin/misty-grant-app-role:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    entrypoint: ["/bin/sh", "/usr/local/bin/misty-grant-app-role"]
    networks: [database]

  misty-api:
    <<: *api-image
    container_name: misty-api
    restart: unless-stopped
    env_file:
      - path: .env/dev/runtime.env
        required: true
      - path: .env/dev/database.env
        required: true
      - path: .env/dev/storage.env
        required: true
      - path: .env/dev/observability.env
        required: true
      - path: .env/dev/integrations/ai.env
        required: true
      - path: .env/dev/integrations/discord.env
        required: true
      - path: .env/dev/integrations/dropbox.env
        required: true
      - path: .env/dev/integrations/email.env
        required: true
      - path: .env/dev/integrations/figma.env
        required: true
      - path: .env/dev/integrations/github.env
        required: true
      - path: .env/dev/integrations/instagram.env
        required: true
      - path: .env/dev/integrations/google.env
        required: true
      - path: .env/dev/integrations/microsoft.env
        required: true
      - path: .env/dev/integrations/notion.env
        required: true
      - path: .env/dev/integrations/slack.env
        required: true
      - path: .env/dev/integrations/stripe.env
        required: true
      - path: .env/dev/crypto/documents.env
        required: true
      - path: .env/dev/crypto/journal.env
        required: true
      - path: .env/dev/crypto/devices.env
        required: true
      - path: .env/dev/crypto/spaces.env
        required: true
      - path: .env/dev/crypto/services.env
        required: true
    environment:
      PORT: "8080"
      # The API stays publicly reachable for callbacks, while the development
      # website runs only on localhost through Vite.
      MISTY_PUBLIC_API_URL: "${MISTY_DEV_API_ORIGIN:-https://dev-api.mistysys.com}/v1"
      STRIPE_CHECKOUT_SUCCESS_URL: "${MISTY_LOCAL_WEBSITE_ORIGIN:-http://localhost:5174}/pricing?checkout=success"
      STRIPE_CHECKOUT_CANCEL_URL: "${MISTY_LOCAL_WEBSITE_ORIGIN:-http://localhost:5174}/pricing"
      STRIPE_PORTAL_RETURN_URL: "${MISTY_LOCAL_WEBSITE_ORIGIN:-http://localhost:5174}/settings"
      MISTY_ALLOWED_ORIGINS: "${MISTY_DEV_ALLOWED_ORIGINS:-tauri://localhost,http://tauri.localhost,https://tauri.localhost,http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174,https://dev-app.mistysys.com}"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${DB_USER:-misty_app}
      DB_PASSWORD: ${DB_PASSWORD:-misty}
      DB_NAME: ${DB_NAME:-misty_server}
      MISTY_OPERATOR_USER_ID: ${MISTY_OPERATOR_USER_ID:-8e66b16c-f644-49a7-9730-d62eeae46021}
      DB_MIGRATION_USER: ""
      DB_MIGRATION_PASSWORD: ""
      CLOUDFLARE_API_TOKEN: ""
      PARTYKIT_HOST: ${MISTY_CLOUDFLARE_WORKER_HOST:-misty-journal-collab-dev.mistysys.workers.dev}
      MISTY_JOURNAL_SERVER_ENV_FILE: /run/misty/journal-server.env
      MISTY_AGENT_RUNTIME_URL: http://agent-runtime:3000
      MISTY_AGENT_RUNTIME_INTERNAL_API_URL: http://misty-api:8080
      MISTY_AGENT_RUNTIME_CONTROL_SECRET: ${MISTY_AGENT_RUNTIME_CONTROL_SECRET:-bWlzdHktYWdlbnQtcnVudGltZS1kZXYtc2VjcmV0ISE=}
      MISTY_AGENT_RUNTIME_CONTROL_SECRET_PREVIOUS: ${MISTY_AGENT_RUNTIME_CONTROL_SECRET_PREVIOUS:-}
      MISTY_ACTIVEPIECES_MCP_URL: "${ACTIVEPIECES_PUBLIC_URL:-https://dev-api.mistysys.com/activepieces}/mcp"
      MISTY_ACTIVEPIECES_PROXY_URL: http://activepieces-app:80
      MISTY_ACTIVEPIECES_BOOTSTRAP_SECRET: "${ACTIVEPIECES_JWT_SECRET:?set ACTIVEPIECES_JWT_SECRET}"
    volumes:
      - dev_runtime:/run/misty:ro
    depends_on:
      database-permissions:
        condition: service_completed_successfully
        restart: true
      dev-init:
        condition: service_completed_successfully
      agent-runtime:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8080/health >/dev/null"]
      interval: 3s
      timeout: 5s
      retries: 30
    entrypoint: ["/bin/sh", "/usr/local/bin/misty-dev-api-entrypoint"]
    ports:
      - "127.0.0.1:${MISTY_HOST_PORT:-8081}:8080"
    networks: [edge, database]

  tunnel:
    image: misty-cloudflared-dev:local
    build:
      context: .
      dockerfile_inline: |
        FROM cloudflare/cloudflared:2026.7.3@sha256:e39ee8da81ad5e05d77f38d2f51c60ca51bf2a8450ac3abab50c17fdb91d91bf AS cloudflared

        FROM alpine:3.22.1@sha256:4bcff63911fcb4448bd4fdacec207030997caf25e9bea4045fa6c8c44de311d1

        RUN apk add --no-cache ca-certificates

        COPY --from=cloudflared /usr/local/bin/cloudflared /usr/local/bin/cloudflared

        ENTRYPOINT ["/usr/local/bin/cloudflared"]

    restart: unless-stopped

    env_file:
      - path: .env/dev/integrations/cloudflare.env
        required: true

    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        export TUNNEL_TOKEN="$${CLOUDFLARE_TUNNEL_TOKEN}"
        unset CLOUDFLARE_TUNNEL_TOKEN
        exec /usr/local/bin/cloudflared tunnel --no-autoupdate --metrics 0.0.0.0:20241 run

    depends_on:
      misty-api:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O - http://127.0.0.1:20241/metrics | grep -Eq '^cloudflared_tunnel_ha_connections [1-9][0-9]*(\\.[0-9]+)?$'"
        ]
      interval: 15s
      timeout: 7s
      retries: 3
      start_period: 10s

    networks:
      - edge

  cloudflare-deploy:
    <<: *cloudflare-image
    container_name: misty-cloudflare-deploy
    restart: "no"
    env_file:
      - path: .env/dev/integrations/cloudflare.env
        required: true
    environment:
      MISTY_CLOUDFLARE_WORKER_NAME: ${MISTY_CLOUDFLARE_WORKER_NAME:-misty-journal-collab-dev}
      MISTY_DEV_API_ORIGIN: ${MISTY_DEV_API_ORIGIN:-https://dev-api.mistysys.com}
    volumes:
      - ./cloudflare/journal-collab:/workspace:ro
    depends_on:
      tunnel:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/usr/local/bin/misty-cloudflare-deploy"]
    networks: [edge]

volumes:
  pgdata:
  agent_runtime_pgdata:
  dev_runtime:
  activepieces_pgdata:
  activepieces_redisdata:
  activepieces_cache:

networks:
  edge:
  database:
    internal: true
  agent-runtime-database:
    internal: true
  activepieces-database:
    internal: true
